# Copy to <target-repo>/.beehive/config.yml and fill in.
spec: .beehive/phase-spec.md
conventions: "see CLAUDE.md / AGENTS.md"
mode: autobuild                    # autobuild (default; runs unattended, never asks to start a swarm) | review

# Large, weakly-bounded files. Any two phases that both touch one of these
# are forced into separate swarms.
hot_files:
  - path/to/big/monolithic/file

# Minimum every Builder reads first. Keep short.
context:
  - CLAUDE.md

# Full suite — every command must exit 0 to pass a swarm's test gate. From repo root.
# The Coordinator runs independent commands (backend vs frontend) concurrently.
test:
  - "your backend test command"
  - "your frontend test command"

# Optional fast subset a Builder runs while iterating (full suite is the gate's job).
# {phase_area} is substituted with a keyword from the phase if you use it.
test_quick: "your quick test command -k {phase_area}"

boot: "your dev-server command"    # for the Verifier; optional
heavy_review: "/code-review ultra" # human-run only; the protocol never invokes it

# Per-role models (platform permitting), routed by stakes not role name
# (§Speed lever 9). The Interviewer sets `cheap` — don't leave it `default`,
# or every curl-and-paste Verifier and every routine Builder runs at the
# strong rate.
models:
  strong: default                 # Coordinator, full-gate Reviewer, risk:empirical Builder
  cheap: <cheapest capable model> # Verifier, standard-gate Reviewer, every routine
                                   # Builder (a `light` gate has no separate Reviewer
                                   # agent at all)
